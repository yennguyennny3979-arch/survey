<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Khảo sát nhận diện thương hiệu</title>

<style>
body{
    font-family: Arial;
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

#timer{
    font-size: 40px;
    font-weight: bold;
    text-align: center;
    margin: 10px;
}

.grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.card{
    border: 2px solid #ddd;
    padding: 8px;
    cursor: pointer;
    transition: 0.2s;
}

.card img{
    width: 100%;
}

.selected{
    border: 4px solid green;
}
button{
    padding: 10px;
    margin: 5px;
}
</style>

</head>

<body>

<h2 id="questionTitle"></h2>
<div id="timer">0</div>

<div id="answers" class="grid"></div>

<div id="controls"></div>

<script src="script.js"></script>

</body>
</html>
