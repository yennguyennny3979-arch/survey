<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Khảo sát nhận diện</title>

<style>
body{
    font-family: Arial;
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

#questionBox{
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 10px;
    line-height: 1.5;
}

#timer{
    font-size: 36px;
    text-align: center;
    font-weight: bold;
    margin: 10px 0;
}

.grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.card{
    border: 2px solid #ddd;
    padding: 10px;
    cursor: pointer;
    user-select: none;
    transition: 0.2s;
}

.card img{
    width: 100%;
    display: block;
}

.selected{
    border: 3px solid green;
}
</style>

</head>

<body>

<div id="questionBox"></div>
<div id="timer">0</div>
<div id="answers" class="grid"></div>

<script src="script.js"></script>

</body>
</html>
